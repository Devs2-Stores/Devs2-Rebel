# .theme-check.yml - Shopify Theme Check configuration
extends: :default

# Exclude directories that are not part of the theme
ignore:
  - "_reference/**"
  - "_changelogs/**"
  - ".agent/**"
  - "tools/**"
  - "node_modules/**"
  - "plans/**"
  - "runs/**"
  - "scratch/**"
  - "scripts/**"
  - ".research-repos-*/**"
  - ".playwright-mcp/**"
  - ".antifan/**"
  - "specs/**"

# Allow larger templates
TemplateLength:
  enabled: true
  max_length: 600

DeprecatedTag:
  enabled: true

# UnknownFilter stays on: pickup availability is rendered by
# sections/pickup-availability.liquid and the <pickup-availability> element.
UnknownFilter:
  enabled: true

# UndefinedObject stays at the default: this Theme Check version parses {% doc %} params.
UndefinedObject:
  enabled: true

# OrphanedSnippet: skip-to-content-link.liquid is rendered from layout/theme.liquid,
# but Theme Check does not detect that call site.
OrphanedSnippet:
  enabled: true
  ignore:
    - "snippets/skip-to-content-link.liquid"

# RemoteAsset: sections/video.liquid builds a protocol-relative YouTube thumbnail poster.
RemoteAsset:
  enabled: true
  ignore:
    - "sections/video.liquid"

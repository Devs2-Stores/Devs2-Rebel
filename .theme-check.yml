# .theme-check.yml — Cấu hình Shopify Theme Check
extends: :default

# Loại trừ thư mục không thuộc theme thực sự
ignore:
  - "_reference/**"
  - "_changelogs/**"
  - ".agent/**"
  - "tools/**"
  - "node_modules/**"

# Cho phép file lớn hơn trong giai đoạn migrate
TemplateLength:
  enabled: true
  max_length: 600

AssetSizeCSS:
  enabled: true
  threshold_in_bytes: 150000

AssetSizeJavaScript:
  enabled: true
  threshold_in_bytes: 150000

# Tạm tắt trong quá trình migrate — bật lại sau
DeprecatedTag:
  enabled: false

# pickup_availability là Liquid filter chuẩn của Shopify (Online Store 2.0).
# Theme-check version cũ chưa biết, disable cảnh báo false positive.
UnknownFilter:
  enabled: true
  ignore:
    - "sections/main-product.liquid"

# UndefinedObject: Shopify CLI 4.1.0 theme-check chưa parse được {% doc %} Liquid Doc Format.
# 10 snippet dưới đây đã có {% doc %} đầy đủ params (verify: .agent/tools/check_doc_coverage.mjs).
# Ignore tới khi tooling cập nhật.
UndefinedObject:
  enabled: true
  ignore:
    - "snippets/icon.liquid"
    - "snippets/collection-best.liquid"
    - "snippets/collection-card.liquid"
    - "snippets/collection-menu.liquid"
    - "snippets/collection-sort.liquid"
    - "snippets/collection-facet-filter.liquid"
    - "snippets/countdown-banner.liquid"
    - "snippets/product-card.liquid"
    - "snippets/product-card-special.liquid"
    - "snippets/product-variant-dropdown.liquid"
    - "layout/password.liquid"

# OrphanedSnippet: skip-to-content-link.liquid đang được render trong theme.liquid line 14
# nhưng theme-check không phát hiện vì call site phức tạp.
OrphanedSnippet:
  enabled: true
  ignore:
    - "snippets/skip-to-content-link.liquid"

# RemoteAsset: 3 trường hợp intentional/false positive
# - sections/gallery.liquid: SVG inline base64 placeholder cho lightbox
# - sections/main-search-smart.liquid: false positive (chuỗi `else no_image.png | asset_url` bị bắt nhầm)
# - sections/video.liquid: YouTube i.ytimg.com thumbnail (nếu giữ embed YouTube native)
RemoteAsset:
  enabled: true
  ignore:
    - "sections/gallery.liquid"
    - "sections/main-search-smart.liquid"
    - "sections/video.liquid"

name: Shopify Theme Store CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: AST Validation & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for f in assets/*.js; do
            node --check "$f"
          done

      - name: Parse theme JSON
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const walk = (dir) => fs.existsSync(dir)
            ? fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) => {
                const full = path.join(dir, e.name);
                return e.isDirectory() ? walk(full) : full.endsWith('.json') ? [full] : [];
              })
            : [];
          let bad = 0;
          for (const file of ['config', 'templates', 'sections', 'blocks', 'locales', 'listings'].flatMap(walk)) {
            try {
              JSON.parse(fs.readFileSync(file, 'utf8').replace(/^\s*\/\*[\s\S]*?\*\//, ''));
            } catch (e) {
              bad++;
              console.error(`${file}: ${e.message}`);
            }
          }
          process.exit(bad ? 1 : 0);
          EOF

      - name: Validate Settings Are Read
        run: node scripts/settings-usage.cjs

      - name: Validate Schema Range Math
        run: node scripts/validate-schema-ranges.mjs

      - name: Validate Locale Integrity & Parity
        run: node scripts/validate-locales.mjs

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@4.8.3

      - name: Run Shopify Theme Check
        run: shopify theme check --fail-level error

      - name: Package Distribution Theme ZIP
        run: python scripts/package-theme.py

      - name: Upload Distribution Theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sartor-theme-zip
          path: dist/sartor-v*.zip
          if-no-files-found: error

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" role="img" aria-labelledby="title description">
  <title id="title">Sculptural utility fashion editorial</title>
  <desc id="description">An abstract full-length fashion figure in charcoal, olive and cream standing in a dramatic concrete studio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
